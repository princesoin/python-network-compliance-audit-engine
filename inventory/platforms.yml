arista_eos:
    template_dir: "/home/princesoin/netlab/repo/templates/eos"
    collect_command: 
        ntp: show running-config | include ntp
        firmware: Show Version 
        hardening: show management ssh
    error_handling:
        error_pattern: "% Invalid input"

nokia_srl:
    template_dir: "/home/princesoin/netlab/repo/templates/srlinux"
    collect_command: 
        ntp: info flat from running / system ntp
        firmware: show version
        hardening: info from state system | grep -E "ssh-server|fips-140|oper-state|admin-state"
    error_handling:
        error_pattern: "Parsing error:|Error: Type check failed"

fortinet:
    template_dir: "/home/princesoin/netlab/repo/templates/fortios"
    collect_command: 
        ntp : show system ntp
        firmware: get system status | grep '^Version:'
        hardening: 
            - "get system info admin ssh"
            - "get system status | grep -i fips"
    error_handling:
        error_pattern: "command parse error"