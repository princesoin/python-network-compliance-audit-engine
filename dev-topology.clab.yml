name: dev-compliance-lab

topology:
  nodes:
    hq-core-sw:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l
      startup-config: srl-startup.cfg

    dubbo-branch-sw:
      kind: nokia_srlinux
      image: ghcr.io/nokia/srlinux:latest
      type: ixr-d2l
      startup-config: srl-startup.cfg

    internal-app-server:
      kind: linux
      image: alpine:latest
      exec:
        - ip addr add 192.168.10.50/24 dev eth1
        - ip route add 0.0.0.0/0 via 192.168.10.1

  links:
    - endpoints: ["hq-core-sw:e1-1", "dubbo-branch-sw:e1-1"]
    - endpoints: ["dubbo-branch-sw:e1-2", "internal-app-server:eth1"]
